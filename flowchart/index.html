<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Directive Flowchart</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>AI Directive Flowchart Viewer</h1>
        <p>A visualization tool for AI workflow directives</p>
    </header>
    
    <div class="toolbar">
        <div class="instructions">
            <p>This flowchart displays the automated AI directive workflow. The sample below represents a portion of a TDD workflow.</p>
            <ul class="legend">
                <li><span class="legend-item legend-automated"></span> Automated Process</li>
                <li><span class="legend-item legend-manual"></span> Manual Action</li>
                <li><span class="legend-item legend-info"></span> Information</li>
            </ul>
        </div>
    </div>
    
    <div class="flowchart-container">
        <!-- The flowchart will be rendered here -->
    </div>
    
    <script src="flowchart.js"></script>
</body>
</html>
