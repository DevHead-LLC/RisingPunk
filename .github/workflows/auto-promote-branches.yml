name: Auto-Promote Branches with Cursor Bug Checks

on:
  check_run:
    types:
      - completed

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  promote-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: write

    steps:
      - name: Setup GitHub CLI and tools
        run: |
          gh --version
          sudo apt-get update && sudo apt-get install -y jq || echo "jq installation skipped"

      - name: Resolve and validate context
        id: context
        run: |
          EVENT=$(cat "$GITHUB_EVENT_PATH")
          NAME=$(echo "$EVENT" | jq -r '.check_run.name // ""')
          CONCLUSION=$(echo "$EVENT" | jq -r '.check_run.conclusion // ""')
          PR_NUM=$(echo "$EVENT" | jq -r '.check_run.pull_requests[0].number // empty')
          HEAD_REF=$(echo "$EVENT" | jq -r '.check_run.pull_requests[0].head.ref // empty')
          BASE_REF=$(echo "$EVENT" | jq -r '.check_run.pull_requests[0].base.ref // empty')
          HEAD_SHA=$(echo "$EVENT" | jq -r '.check_run.head_sha // ""')
          CHECK_RUN_ID=$(echo "$EVENT" | jq -r '.check_run.id // ""')
          
          if ! echo "$NAME" | grep -qi cursor; then
            echo "Not Cursor check (name: $NAME), skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CONCLUSION" != "success" ] && [ "$CONCLUSION" != "neutral" ]; then
            echo "Cursor check conclusion not success/neutral: $CONCLUSION"
            exit 1
          fi
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "No PR in check_run payload (fork or empty pull_requests)."
            exit 1
          fi
          if [ -z "$HEAD_REF" ] || [ "$HEAD_REF" = "null" ]; then
            HEAD_REF=$(gh pr view "$PR_NUM" --json headRefName -q '.headRefName' 2>/dev/null || echo "")
          fi
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "null" ]; then
            BASE_REF=$(gh pr view "$PR_NUM" --json baseRefName -q '.baseRefName' 2>/dev/null || echo "")
          fi
          if [ -z "$HEAD_REF" ] || [ -z "$BASE_REF" ]; then
            echo "Could not resolve head or base ref for PR #$PR_NUM"
            exit 1
          fi
          case "$BASE_REF" in
            dev|main|staging|prod) ;;
            *)
              echo "Base ref $BASE_REF is not dev/main/staging/prod, skipping."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "check_run_id=$CHECK_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Cursor check passed; PR #$PR_NUM ($HEAD_REF → $BASE_REF). Proceeding."

      - name: Checkout repository
        if: steps.context.outputs.skipped != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          ref: ${{ steps.context.outputs.base_ref }}

      - name: Fetch latest script from head branch
        if: steps.context.outputs.skipped != 'true'
        run: |
          set +e
          git fetch origin ${{ steps.context.outputs.head_ref }} > /tmp/fetch_output.txt 2>&1
          FETCH_EXIT_CODE=$?
          set -e
          
          if [ $FETCH_EXIT_CODE -eq 0 ]; then
            if git show FETCH_HEAD:.github/scripts/promote-branches.sh > /tmp/promote-branches.sh 2>/dev/null; then
              mv /tmp/promote-branches.sh .github/scripts/promote-branches.sh
              chmod +x .github/scripts/promote-branches.sh
              echo "✅ Updated script from head branch (${{ steps.context.outputs.head_ref }})"
            else
              echo "⚠️  Fetch succeeded but script not found in head branch. Using base branch script."
            fi
          else
            echo "ℹ️  Could not fetch head branch (${{ steps.context.outputs.head_ref }}). Using script from base branch."
            echo "   Fetch error: $(cat /tmp/fetch_output.txt 2>/dev/null || echo 'unknown')"
          fi

      - name: Verify no bugs reported
        id: verify_bugs
        if: steps.context.outputs.skipped != 'true'
        run: |
          PR_NUMBER="${{ steps.context.outputs.pr_number }}"
          CHECK_RUN_ID="${{ steps.context.outputs.check_run_id }}"
          
          echo "🔍 Checking for actual bug reports in check run output and PR comments..."
          BUGS_REPORTED=0
          
          if [ -n "$CHECK_RUN_ID" ]; then
            CHECK_OUTPUT=$(gh api repos/${{ github.repository }}/check-runs/$CHECK_RUN_ID 2>/dev/null || echo "{}")
            CHECK_TEXT=$(echo "$CHECK_OUTPUT" | jq -r '.output.summary // .output.text // ""' 2>/dev/null || echo "")
            if echo "$CHECK_TEXT" | grep -qiE "(posted analysis results.*[0-9]+[[:space:]]+bug(s?)[[:space:]]+reported|[0-9]+[[:space:]]+bug(s?)[[:space:]]+reported|found[[:space:]]+[0-9]+[[:space:]]+potential[[:space:]]+issues?)"; then
              BUGS_REPORTED=$(echo "$CHECK_TEXT" | grep -oE "([0-9]+)[[:space:]]+bug(s?)[[:space:]]+reported" | head -1 | grep -oE "[0-9]+" || echo "0")
              if [ "$BUGS_REPORTED" = "0" ]; then
                BUGS_REPORTED=$(echo "$CHECK_TEXT" | grep -oE "posted analysis results.*([0-9]+)[[:space:]]+bug" | grep -oE "[0-9]+" | head -1 || echo "0")
              fi
              if [ -z "$BUGS_REPORTED" ] || [ "$BUGS_REPORTED" = "0" ]; then
                BUGS_REPORTED=$(echo "$CHECK_TEXT" | grep -oE "found[[:space:]]+[0-9]+[[:space:]]+potential[[:space:]]+issues?" | grep -oE "[0-9]+" | head -1 || echo "0")
              fi
            fi
          fi
          
          ISSUE_COMMENTS=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/comments 2>/dev/null || echo "[]")
          CURSOR_COMMENTS=$(echo "$ISSUE_COMMENTS" | jq -r '.[] | select(.user.login | ascii_downcase | contains("cursor")) | .body' 2>/dev/null || echo "")
          if [ -z "$BUGS_REPORTED" ] || [ "$BUGS_REPORTED" = "0" ]; then
            if [ -n "$CURSOR_COMMENTS" ]; then
              if echo "$CURSOR_COMMENTS" | grep -qiE "(posted analysis results.*[0-9]+[[:space:]]+bug(s?)[[:space:]]+reported|[0-9]+[[:space:]]+bug(s?)[[:space:]]+reported|found[[:space:]]+[0-9]+[[:space:]]+potential[[:space:]]+issues?)"; then
                BUGS_REPORTED=$(echo "$CURSOR_COMMENTS" | grep -oE "([0-9]+)[[:space:]]+bug(s?)[[:space:]]+reported" | head -1 | grep -oE "[0-9]+" || echo "0")
                if [ "$BUGS_REPORTED" = "0" ]; then
                  BUGS_REPORTED=$(echo "$CURSOR_COMMENTS" | grep -oE "posted analysis results.*([0-9]+)[[:space:]]+bug" | grep -oE "[0-9]+" | head -1 || echo "0")
                fi
                if [ -z "$BUGS_REPORTED" ] || [ "$BUGS_REPORTED" = "0" ]; then
                  BUGS_REPORTED=$(echo "$CURSOR_COMMENTS" | grep -oE "found[[:space:]]+[0-9]+[[:space:]]+potential[[:space:]]+issues?" | grep -oE "[0-9]+" | head -1 || echo "0")
                fi
              fi
            fi
          fi
          
          if [ -n "$BUGS_REPORTED" ] && [ "$BUGS_REPORTED" -gt 0 ] 2>/dev/null; then
            echo "=========================================="
            echo "❌ CRITICAL: Cursor bot reported $BUGS_REPORTED bug(s)"
            echo "❌ Actual bugs detected - workflow STOPPED"
            echo "❌ No PR will be merged. No promotion will occur."
            echo "=========================================="
            exit 1
          fi
          echo "✅ No bugs reported (checked for 'X bug(s) reported' and 'found X potential issues' patterns)"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Process PR and create next stage PR
        if: steps.context.outputs.skipped != 'true' && steps.verify_bugs.outputs.proceed == 'true'
        run: |
          chmod +x .github/scripts/promote-branches.sh
          .github/scripts/promote-branches.sh \
            "${{ steps.context.outputs.pr_number }}" \
            "${{ steps.context.outputs.head_ref }}" \
            "${{ steps.context.outputs.base_ref }}" \
            "${{ github.repository }}"
          echo "✅ This workflow run is complete"
          echo "   The next workflow will be triggered automatically when the PR is created"
