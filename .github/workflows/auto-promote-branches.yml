name: Auto-Promote Branches with Cursor Bug Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - dev
      - main
      - staging

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  promote-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup GitHub CLI and tools
        run: |
          gh --version
          sudo apt-get update && sudo apt-get install -y jq || echo "jq installation skipped"

      - name: Wait for Cursor bot to complete
        id: wait_for_cursor
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA=$(gh pr view $PR_NUMBER --json headRefOid -q '.headRefOid' 2>/dev/null || echo "")
          
          echo "Waiting for Cursor bot to appear and complete on PR #$PR_NUMBER before proceeding..."
          
          MAX_WAIT=1200
          WAIT_INTERVAL=10
          LOG_INTERVAL=60
          ELAPSED=0
          LAST_LOG_ELAPSED=0
          CURSOR_CHECK_FOUND=false
          CURSOR_CHECK_PASSED=false
          CURSOR_CHECK_FAILED=false
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $WAIT_INTERVAL
            ELAPSED=$((ELAPSED + WAIT_INTERVAL))
            
            HEAD_SHA=$(gh pr view $PR_NUMBER --json headRefOid -q '.headRefOid' 2>/dev/null || echo "$HEAD_SHA")
            
            CHECKS_JSON=$(gh api repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs 2>/dev/null || echo "{}")
            
            if command -v jq &> /dev/null; then
              CURSOR_CHECK_NAME=$(echo "$CHECKS_JSON" | jq -r '.check_runs[] | select(.name | ascii_downcase | contains("cursor")) | .name' | head -1 || echo "")
              CURSOR_CHECK_STATUS=$(echo "$CHECKS_JSON" | jq -r '.check_runs[] | select(.name | ascii_downcase | contains("cursor")) | .status // empty' | head -1 || echo "")
              CURSOR_CHECK_CONCLUSION=$(echo "$CHECKS_JSON" | jq -r '.check_runs[] | select(.name | ascii_downcase | contains("cursor")) | .conclusion // empty' | head -1 || echo "")
            else
              CURSOR_CHECK_NAME=$(echo "$CHECKS_JSON" | grep -i "cursor" -A 10 | grep -oP '"name":\s*"\K[^"]+' | head -1 || echo "")
              CURSOR_CHECK_STATUS=$(echo "$CHECKS_JSON" | grep -i "cursor" -A 10 | grep -oP '"status":\s*"\K[^"]+' | head -1 || echo "")
              CURSOR_CHECK_CONCLUSION=$(echo "$CHECKS_JSON" | grep -i "cursor" -A 10 | grep -oP '"conclusion":\s*"\K[^"]+' | head -1 || echo "")
            fi
            
            SHOULD_LOG=false
            if [ $((ELAPSED - LAST_LOG_ELAPSED)) -ge $LOG_INTERVAL ]; then
              SHOULD_LOG=true
              LAST_LOG_ELAPSED=$ELAPSED
            fi
            
            if [ -n "$CURSOR_CHECK_NAME" ]; then
              CURSOR_CHECK_FOUND=true
              if [ "$SHOULD_LOG" = "true" ]; then
                echo "Found Cursor check: $CURSOR_CHECK_NAME (status: ${CURSOR_CHECK_STATUS:-not set}, conclusion: ${CURSOR_CHECK_CONCLUSION:-not set})"
              fi
              
              if [ "$CURSOR_CHECK_STATUS" = "completed" ]; then
                if [ "$CURSOR_CHECK_CONCLUSION" = "failure" ] || [ "$CURSOR_CHECK_CONCLUSION" = "action_required" ]; then
                  echo "❌ Cursor bot completed with failure. Stopping workflow."
                  CURSOR_CHECK_FAILED=true
                  break
                elif [ "$CURSOR_CHECK_CONCLUSION" = "success" ] || [ "$CURSOR_CHECK_CONCLUSION" = "neutral" ]; then
                  echo "✅ Cursor bot completed successfully (conclusion: $CURSOR_CHECK_CONCLUSION). Proceeding with promotion."
                  CURSOR_CHECK_PASSED=true
                  break
                elif [ "$CURSOR_CHECK_CONCLUSION" = "cancelled" ] || [ "$CURSOR_CHECK_CONCLUSION" = "skipped" ] || [ "$CURSOR_CHECK_CONCLUSION" = "timed_out" ] || [ "$CURSOR_CHECK_CONCLUSION" = "stale" ]; then
                  echo "❌ Cursor check completed with terminal state ($CURSOR_CHECK_CONCLUSION). Treating as failure."
                  CURSOR_CHECK_FAILED=true
                  break
                elif [ -z "$CURSOR_CHECK_CONCLUSION" ] || [ "$CURSOR_CHECK_CONCLUSION" = "null" ]; then
                  echo "⚠️  Cursor check completed but conclusion is null/unexpected. Treating as failure for safety."
                  CURSOR_CHECK_FAILED=true
                  break
                else
                  echo "❌ Cursor check completed with unknown conclusion ($CURSOR_CHECK_CONCLUSION). Treating as failure for safety."
                  CURSOR_CHECK_FAILED=true
                  break
                fi
              elif [ "$CURSOR_CHECK_STATUS" = "queued" ] || [ "$CURSOR_CHECK_STATUS" = "in_progress" ]; then
                if [ "$SHOULD_LOG" = "true" ]; then
                  echo "⏳ Cursor bot is running (status: $CURSOR_CHECK_STATUS). Waiting for completion..."
                fi
              fi
            fi
            
            STATUS_CHECKS_JSON=$(gh api repos/${{ github.repository }}/commits/$HEAD_SHA/statuses 2>/dev/null || echo "[]")
            
            if command -v jq &> /dev/null; then
              CURSOR_STATUS=$(echo "$STATUS_CHECKS_JSON" | jq -r '.[] | select(.context | ascii_downcase | contains("cursor")) | .state' | head -1 || echo "")
            else
              CURSOR_STATUS=$(echo "$STATUS_CHECKS_JSON" | grep -i "cursor" | grep -oP '"state":\s*"\K[^"]+' | head -1 || echo "")
            fi
            
            if [ -n "$CURSOR_STATUS" ]; then
              CURSOR_CHECK_FOUND=true
              if [ "$CURSOR_STATUS" = "success" ]; then
                echo "✅ Cursor bot passed (status check). Proceeding with promotion."
                CURSOR_CHECK_PASSED=true
                break
              elif [ "$CURSOR_STATUS" = "failure" ] || [ "$CURSOR_STATUS" = "error" ]; then
                echo "❌ Cursor bot failed (status check: $CURSOR_STATUS). Stopping workflow."
                CURSOR_CHECK_FAILED=true
                break
              fi
            fi
            
            if [ "$SHOULD_LOG" = "true" ]; then
              if [ "$CURSOR_CHECK_FOUND" = "false" ]; then
                echo "Waiting for Cursor bot to appear... (${ELAPSED}s/${MAX_WAIT}s)"
              else
                echo "Waiting for Cursor bot to complete... (${ELAPSED}s/${MAX_WAIT}s)"
              fi
            fi
          done
          
          if [ "$CURSOR_CHECK_FAILED" = "true" ]; then
            echo "❌ Cursor bot check failed. Workflow stopped."
            exit 1
          fi
          
          if [ "$CURSOR_CHECK_PASSED" = "true" ]; then
            echo "✅ Cursor bot check COMPLETE: conclusion = 'success'"
            echo "✅ Setting completion flag: cursor_completed=true"
            echo "cursor_completed=true" >> $GITHUB_OUTPUT
          elif [ "$CURSOR_CHECK_FOUND" = "false" ]; then
            echo "⚠️  Cursor bot did not appear within timeout (${MAX_WAIT}s). Stopping workflow."
            exit 1
          else
            echo "⚠️  Cursor bot did not complete within timeout (${MAX_WAIT}s). Stopping workflow."
            exit 1
          fi

      - name: Process PR and create next stage PR
        if: steps.wait_for_cursor.outputs.cursor_completed == 'true'
        run: |
          chmod +x .github/scripts/promote-branches.sh
          .github/scripts/promote-branches.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.ref }}" \
            "${{ github.event.pull_request.base.ref }}" \
            "${{ github.repository }}"
          echo "✅ This workflow run is complete"
          echo "   The next workflow will be triggered automatically when the PR is created"
