name: Auto-Promote Branches with Cursor Bug Checks

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to promote (default: current branch)'
        required: false
        type: string
      target_branch:
        description: 'Target branch to start from (dev, main, staging, or prod)'
        required: false
        type: choice
        options:
          - dev
          - main
          - staging
          - prod
        default: 'dev'
  pull_request:
    types:
      - opened
      - synchronize
      - closed
    branches:
      - dev
      - main
      - staging

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  promote-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: read
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine source and target branches
        id: branches
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOURCE_BRANCH="${{ github.event.inputs.source_branch }}"
            TARGET_BRANCH="${{ github.event.inputs.target_branch }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
              BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
              SOURCE_BRANCH="$BASE_BRANCH"
              if [ "$BASE_BRANCH" = "dev" ]; then
                TARGET_BRANCH="main"
              elif [ "$BASE_BRANCH" = "main" ]; then
                TARGET_BRANCH="staging"
              elif [ "$BASE_BRANCH" = "staging" ]; then
                TARGET_BRANCH="prod"
              else
                TARGET_BRANCH="dev"
              fi
              echo "PR merged to $BASE_BRANCH, will continue promotion to $TARGET_BRANCH"
            else
              SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
              TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
              echo "PR opened/updated: $SOURCE_BRANCH → $TARGET_BRANCH, will check Cursor and auto-promote if no bugs"
            fi
          else
            SOURCE_BRANCH="${{ github.ref_name }}"
            TARGET_BRANCH="dev"
          fi
          
          if [ -z "$SOURCE_BRANCH" ]; then
            SOURCE_BRANCH="${{ github.ref_name }}"
          fi
          
          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT
          echo "target_branch=${TARGET_BRANCH:-dev}" >> $GITHUB_OUTPUT
          echo "Starting promotion from $SOURCE_BRANCH to ${TARGET_BRANCH:-dev}"

      - name: Setup GitHub CLI and tools
        run: |
          gh --version
          sudo apt-get update && sudo apt-get install -y jq || echo "jq installation skipped"

      - name: Promote through branch chain
        id: promote
        env:
          SOURCE_BRANCH: ${{ steps.branches.outputs.source_branch }}
          START_TARGET: ${{ steps.branches.outputs.target_branch }}
        run: |
          set -e
          
          BRANCHES=("dev" "main" "staging" "prod")
          CURRENT_SOURCE="$SOURCE_BRANCH"
          
          START_INDEX=0
          for i in "${!BRANCHES[@]}"; do
            if [ "${BRANCHES[$i]}" = "$START_TARGET" ]; then
              START_INDEX=$i
              break
            fi
          done
          
          for ((i=$START_INDEX; i<${#BRANCHES[@]}; i++)); do
            TARGET="${BRANCHES[$i]}"
            
            if [ "$CURRENT_SOURCE" = "$TARGET" ]; then
              echo "Source and target are the same ($TARGET), skipping..."
              continue
            fi
            
            echo "=========================================="
            echo "Promoting: $CURRENT_SOURCE → $TARGET"
            echo "=========================================="
            
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.base.ref }}" = "$TARGET" ] && [ "${{ github.event.pull_request.head.ref }}" = "$CURRENT_SOURCE" ]; then
              PR_NUMBER="${{ github.event.pull_request.number }}"
              echo "Using existing PR #$PR_NUMBER that triggered this workflow"
            else
              PR_TITLE="Auto-promote: $CURRENT_SOURCE → $TARGET"
              PR_BODY="Automated promotion from $CURRENT_SOURCE to $TARGET branch.
            
            This PR was created automatically by the branch promotion workflow.
            Cursor bug bot will run automatically on this PR."
              
              EXISTING_PR=$(gh pr list --base "$TARGET" --head "$CURRENT_SOURCE" --state open --json number -q '.[0].number' 2>/dev/null || echo "")
              
              if [ -n "$EXISTING_PR" ]; then
                echo "PR already exists: #$EXISTING_PR"
                PR_NUMBER="$EXISTING_PR"
              else
              echo "Creating PR: $CURRENT_SOURCE → $TARGET"
              PR_NUMBER=$(gh pr create \
                --base "$TARGET" \
                --head "$CURRENT_SOURCE" \
                --title "$PR_TITLE" \
                --body "$PR_BODY" \
                --draft false 2>&1 | grep -oP 'pull/\K[0-9]+' || echo "")
              
              if [ -z "$PR_NUMBER" ]; then
                echo "Failed to create PR. Trying alternative method..."
                PR_RESPONSE=$(gh api repos/${{ github.repository }}/pulls \
                  -X POST \
                  -f base="$TARGET" \
                  -f head="$CURRENT_SOURCE" \
                  -f title="$PR_TITLE" \
                  -f body="$PR_BODY" 2>&1)
                PR_NUMBER=$(echo "$PR_RESPONSE" | grep -oP '"number":\s*\K[0-9]+' || echo "")
              fi
              
              if [ -z "$PR_NUMBER" ]; then
                echo "❌ Failed to create PR from $CURRENT_SOURCE to $TARGET"
                exit 1
              fi
              
              echo "✅ Created PR #$PR_NUMBER: $CURRENT_SOURCE → $TARGET"
              fi
            fi
            
            echo "Waiting for Cursor bug bot to run on PR #$PR_NUMBER..."
            
            MAX_WAIT=600
            WAIT_INTERVAL=10
            ELAPSED=0
            CURSOR_CHECK_PASSED=false
            CURSOR_CHECK_FAILED=false
            HEAD_SHA=$(gh pr view $PR_NUMBER --json headRefOid -q '.headRefOid' 2>/dev/null || echo "")
            
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              sleep $WAIT_INTERVAL
              ELAPSED=$((ELAPSED + WAIT_INTERVAL))
              
              PR_STATE=$(gh pr view $PR_NUMBER --json state,mergeable -q '.state' 2>/dev/null || echo "")
              
              HEAD_SHA=$(gh pr view $PR_NUMBER --json headRefOid -q '.headRefOid' 2>/dev/null || echo "$HEAD_SHA")
              
              STATUS_CHECKS_JSON=$(gh api repos/${{ github.repository }}/commits/$HEAD_SHA/statuses 2>/dev/null || echo "[]")
              
              if command -v jq &> /dev/null; then
                CURSOR_STATUS=$(echo "$STATUS_CHECKS_JSON" | jq -r '.[] | select(.context | ascii_downcase | contains("cursor")) | .state' | head -1 || echo "")
              else
                CURSOR_STATUS=$(echo "$STATUS_CHECKS_JSON" | grep -i "cursor" | grep -oP '"state":\s*"\K[^"]+' | head -1 || echo "")
              fi
              
              if [ -n "$CURSOR_STATUS" ]; then
                if [ "$CURSOR_STATUS" = "success" ]; then
                  echo "✅ Cursor bug check passed (status check)!"
                  CURSOR_CHECK_PASSED=true
                  break
                elif [ "$CURSOR_STATUS" = "failure" ] || [ "$CURSOR_STATUS" = "error" ]; then
                  echo "❌ Cursor bug check failed (status check: $CURSOR_STATUS)!"
                  CURSOR_CHECK_FAILED=true
                  break
                fi
              fi
              
              CHECKS_JSON=$(gh api repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs 2>/dev/null || echo "{}")
              
              if command -v jq &> /dev/null; then
                CURSOR_CHECK_STATUS=$(echo "$CHECKS_JSON" | jq -r '.check_runs[] | select(.name | ascii_downcase | contains("cursor")) | .status // empty' | head -1 || echo "")
                CURSOR_CHECK_CONCLUSION=$(echo "$CHECKS_JSON" | jq -r '.check_runs[] | select(.name | ascii_downcase | contains("cursor")) | .conclusion // empty' | head -1 || echo "")
              else
                CURSOR_CHECK_STATUS=$(echo "$CHECKS_JSON" | grep -i "cursor" -A 10 | grep -oP '"status":\s*"\K[^"]+' | head -1 || echo "")
                CURSOR_CHECK_CONCLUSION=$(echo "$CHECKS_JSON" | grep -i "cursor" -A 10 | grep -oP '"conclusion":\s*"\K[^"]+' | head -1 || echo "")
              fi
              
              if [ -n "$CURSOR_CHECK_STATUS" ] && [ "$CURSOR_CHECK_STATUS" = "completed" ]; then
                if [ "$CURSOR_CHECK_CONCLUSION" = "success" ] || [ "$CURSOR_CHECK_CONCLUSION" = "neutral" ]; then
                  echo "✅ Cursor bug check passed (check run: $CURSOR_CHECK_CONCLUSION)!"
                  CURSOR_CHECK_PASSED=true
                  break
                elif [ "$CURSOR_CHECK_CONCLUSION" = "failure" ] || [ "$CURSOR_CHECK_CONCLUSION" = "action_required" ]; then
                  echo "❌ Cursor bug check failed (check run: $CURSOR_CHECK_CONCLUSION)!"
                  CURSOR_CHECK_FAILED=true
                  break
                elif [ -z "$CURSOR_CHECK_CONCLUSION" ] || [ "$CURSOR_CHECK_CONCLUSION" = "null" ]; then
                  echo "⚠️  Cursor check completed but conclusion is null/unexpected. Treating as failure for safety."
                  CURSOR_CHECK_FAILED=true
                  break
                fi
              elif [ -n "$CURSOR_CHECK_STATUS" ] && [ "$CURSOR_CHECK_STATUS" != "completed" ]; then
                echo "⏳ Cursor check is in progress (status: $CURSOR_CHECK_STATUS). Waiting..."
              fi
              
              PR_COMMENTS_JSON=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/comments 2>/dev/null || echo "[]")
              
              if command -v jq &> /dev/null; then
                CURSOR_COMMENTS=$(echo "$PR_COMMENTS_JSON" | jq -r '.[] | select(.user.login | ascii_downcase | contains("cursor") or contains("app") or contains("[bot]")) | .body' 2>/dev/null || echo "")
              else
                CURSOR_COMMENTS=$(echo "$PR_COMMENTS_JSON" | grep -i "cursor\|\[bot\]" -A 5 | grep -oP '"body":\s*"\K[^"]+' || echo "")
              fi
              
              if [ -n "$CURSOR_COMMENTS" ]; then
                if echo "$CURSOR_COMMENTS" | grep -qiE "(bugs?|issues?|errors?)\s+(found|detected|identified)|(blocking|critical)\s+(bug|issue|error)|must\s+fix|(failed|failing)\s+(check|test|validation)"; then
                  echo "❌ Cursor comments indicate bugs found!"
                  CURSOR_CHECK_FAILED=true
                  break
                elif echo "$CURSOR_COMMENTS" | grep -qiE "no bugs|no issues|passed|success|all clear|no problems found"; then
                  echo "✅ Cursor comments indicate no bugs found"
                  CURSOR_CHECK_PASSED=true
                  break
                elif [ -n "$CURSOR_CHECK_STATUS" ] && [ "$CURSOR_CHECK_STATUS" = "completed" ]; then
                  if [ "$CURSOR_CHECK_CONCLUSION" = "success" ] || [ "$CURSOR_CHECK_CONCLUSION" = "neutral" ]; then
                    echo "✅ Cursor check run completed with $CURSOR_CHECK_CONCLUSION. Comments are informational, proceeding..."
                    CURSOR_CHECK_PASSED=true
                    break
                  fi
                elif [ -n "$CURSOR_CHECK_CONCLUSION" ] && [ "$CURSOR_CHECK_CONCLUSION" = "neutral" ]; then
                  echo "✅ Cursor check run conclusion is neutral. Comments are informational, proceeding..."
                  CURSOR_CHECK_PASSED=true
                  break
                fi
              fi
              
              if [ "$PR_STATE" = "closed" ] || [ "$PR_STATE" = "merged" ]; then
                echo "⚠️  PR #$PR_NUMBER was already merged/closed. Verifying Cursor checks passed before merge..."
                
                PR_DATA=$(gh pr view $PR_NUMBER --json mergeCommit,headRefOid,state 2>/dev/null || echo "")
                if [ -z "$PR_DATA" ]; then
                  echo "❌ Could not retrieve PR data. Cannot verify safety. Stopping."
                  CURSOR_CHECK_FAILED=true
                  break
                fi
                
                if command -v jq &> /dev/null; then
                  MERGE_COMMIT_SHA=$(echo "$PR_DATA" | jq -r '.mergeCommit.oid // empty' 2>/dev/null || echo "")
                  HEAD_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid' 2>/dev/null || echo "")
                else
                  MERGE_COMMIT_SHA=$(echo "$PR_DATA" | grep -oP '"mergeCommit":\s*\{\s*"oid":\s*"\K[^"]+' || echo "")
                  HEAD_SHA=$(echo "$PR_DATA" | grep -oP '"headRefOid":\s*"\K[^"]+' || echo "")
                fi
                
                CHECK_SHA="${MERGE_COMMIT_SHA:-$HEAD_SHA}"
                if [ -z "$CHECK_SHA" ]; then
                  echo "❌ Could not determine commit SHA to check. Cannot verify safety. Stopping."
                  CURSOR_CHECK_FAILED=true
                  break
                fi
                
                CHECKS_JSON=$(gh api repos/${{ github.repository }}/commits/$CHECK_SHA/check-runs 2>/dev/null || echo "{}")
                if command -v jq &> /dev/null; then
                  CURSOR_CHECK_CONCLUSION=$(echo "$CHECKS_JSON" | jq -r '.check_runs[] | select(.name | ascii_downcase | contains("cursor")) | .conclusion // empty' | head -1 || echo "")
                else
                  CURSOR_CHECK_CONCLUSION=$(echo "$CHECKS_JSON" | grep -i "cursor" -A 10 | grep -oP '"conclusion":\s*"\K[^"]+' | head -1 || echo "")
                fi
                
                if [ "$CURSOR_CHECK_CONCLUSION" = "failure" ] || [ "$CURSOR_CHECK_CONCLUSION" = "action_required" ]; then
                  echo "❌ PR was merged but Cursor check failed on commit $CHECK_SHA! This should not have been merged."
                  CURSOR_CHECK_FAILED=true
                  break
                elif [ -z "$CURSOR_CHECK_CONCLUSION" ] || [ "$CURSOR_CHECK_CONCLUSION" = "null" ]; then
                  echo "⚠️  PR was merged but Cursor check is still in-progress or not found on commit $CHECK_SHA. Cannot verify safety. Stopping."
                  CURSOR_CHECK_FAILED=true
                  break
                elif [ "$CURSOR_CHECK_CONCLUSION" = "success" ] || [ "$CURSOR_CHECK_CONCLUSION" = "neutral" ]; then
                  echo "✅ PR was merged and Cursor check passed ($CURSOR_CHECK_CONCLUSION) on commit $CHECK_SHA. Continuing..."
                  CURSOR_CHECK_PASSED=true
                  break
                else
                  echo "⚠️  PR was merged but Cursor check has unexpected conclusion: $CURSOR_CHECK_CONCLUSION. Stopping for safety."
                  CURSOR_CHECK_FAILED=true
                  break
                fi
              fi
              
              
              echo "Waiting for Cursor check... (${ELAPSED}s/${MAX_WAIT}s)"
            done
            
            if [ "$CURSOR_CHECK_FAILED" = "true" ]; then
              echo "=========================================="
              echo "❌ Cursor bug check FAILED for PR #$PR_NUMBER"
              echo "Stopping promotion chain."
              echo "Please fix bugs and restart the workflow."
              echo "PR: https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
              echo "=========================================="
              exit 1
            fi
            
            if [ "$CURSOR_CHECK_PASSED" = "false" ]; then
              echo "=========================================="
              echo "❌ Cursor check did not complete within timeout (${MAX_WAIT}s)."
              echo "Stopping promotion chain for safety."
              echo "Please ensure Cursor bot runs and completes before merging."
              echo "PR: https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
              echo "=========================================="
              exit 1
            fi
            
            PR_STATE_BEFORE_MERGE=$(gh pr view $PR_NUMBER --json state -q '.state' 2>/dev/null || echo "")
            
            if [ "$PR_STATE_BEFORE_MERGE" = "merged" ] || [ "$PR_STATE_BEFORE_MERGE" = "closed" ]; then
              echo "✅ PR #$PR_NUMBER was already merged. Continuing to next branch..."
            else
              echo "Merging PR #$PR_NUMBER: $CURRENT_SOURCE → $TARGET"
              
              MERGE_OUTPUT=$(gh pr merge $PR_NUMBER --merge --delete-branch=false 2>&1)
              MERGE_EXIT_CODE=$?
              
              if [ $MERGE_EXIT_CODE -eq 0 ]; then
                echo "✅ Successfully merged PR #$PR_NUMBER: $CURRENT_SOURCE → $TARGET"
              elif echo "$MERGE_OUTPUT" | grep -qi "already merged\|already been merged"; then
                echo "✅ PR #$PR_NUMBER was already merged (detected during merge attempt). Continuing..."
              else
                echo "❌ Failed to merge PR #$PR_NUMBER (exit code: $MERGE_EXIT_CODE)"
                echo "Merge output: $MERGE_OUTPUT"
                exit 1
              fi
            fi
            
            CURRENT_SOURCE="$TARGET"
            
            if [ "$TARGET" = "prod" ]; then
              echo "=========================================="
              echo "✅ Successfully promoted through all branches!"
              echo "Final: $SOURCE_BRANCH → dev → main → staging → prod"
              echo "=========================================="
              break
            fi
            
            echo "Waiting 5 seconds before next promotion..."
            sleep 5
          done

