name: Deploy API (staging)

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

env:
  ARTIFACT: rp-api-${{ github.sha }}.zip
  EB_BUCKET: ${{ secrets.EB_S3_BUCKET }}         # set to elasticbeanstalk-us-west-2-211125440777
  EB_APP:    ${{ secrets.EB_APP_NAME }}
  EB_ENV:    ${{ secrets.EB_ENV_NAME }}
  REGION:    ${{ secrets.AWS_REGION }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install deps
        run: npm ci

      - name: Build (ts -> dist)
        run: npm run build

      - name: Create Procfile
        run: |
          echo 'web: node dist/server.js' > Procfile

      - name: Zip artifact (dist + runtime files)
        run: |
          zip -r "${{ env.ARTIFACT }}" package.json package-lock.json Procfile dist \
            -x "dist/mobile/*" "**/__tests__/**"

      - name: Configure AWS creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Upload artifact to S3 (EB service bucket)
        run: aws s3 cp "${{ env.ARTIFACT }}" "s3://${{ env.EB_BUCKET }}/${{ env.ARTIFACT }}"

      - name: Ensure EB application version exists (idempotent)
        run: |
          set -e
          EXISTS=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${{ env.EB_APP }}" \
            --version-labels "${{ github.sha }}" \
            --query 'length(ApplicationVersions)' --output text)
          if [ "$EXISTS" = "0" ]; then
            echo "Creating EB application version for ${{ github.sha }} ..."
            aws elasticbeanstalk create-application-version \
              --application-name "${{ env.EB_APP }}" \
              --version-label "${{ github.sha }}" \
              --source-bundle S3Bucket="${{ env.EB_BUCKET }}",S3Key="${{ env.ARTIFACT }}"
          else
            echo "EB application version already exists; continuing."
          fi

      - name: Deploy to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENV }}" \
            --version-label "${{ github.sha }}"

      # Optional: wait until the update finishes
      - name: Wait for environment to finish updating
        run: aws elasticbeanstalk wait environment-updated --environment-names "${{ env.EB_ENV }}"
