<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RisingPunk - Redirecting...</title>
  <meta name="description" content="Download RisingPunk - Strategic Social Warfare MMO">
  
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1MPJG37M1F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1MPJG37M1F');
  </script>
  
  <!-- Redirect with GA4 tracking -->
  <script>
    (function() {
      // Detect OS from User-Agent (matches server-side detection logic)
      function detectOS(userAgent) {
        if (!userAgent) return 'desktop';
        const ua = userAgent.toLowerCase();
        if (/iphone|ipad|ipod/.test(ua)) return 'ios';
        if (/android/.test(ua)) return 'android';
        return 'desktop';
      }
      
      // Get OS type
      const osType = detectOS(navigator.userAgent);
      
      // Get all query parameters from current URL
      const params = new URLSearchParams(window.location.search);
      
      // Extract UTM parameters for tracking
      const utmSource = params.get('utm_source') || '';
      const utmCampaign = params.get('utm_campaign') || '';
      const utmMedium = params.get('utm_medium') || '';
      
      // Track redirect event in GA4
      // Using sendBeacon for reliable delivery even if page unloads quickly
      if (window.gtag) {
        gtag('event', 'smart_redirect', {
          event_category: 'marketing',
          event_label: osType,
          os_type: osType,
          utm_source: utmSource,
          utm_campaign: utmCampaign,
          utm_medium: utmMedium,
          value: 1
        });
      }
      
      // Build redirect URL to API endpoint
      const apiUrl = 'https://api.risingpunk.com/go';
      const queryString = params.toString();
      const redirectUrl = queryString ? `${apiUrl}?${queryString}` : apiUrl;
      
      // Small delay to ensure GA4 event is sent (50ms is imperceptible to users)
      setTimeout(function() {
        window.location.href = redirectUrl;
      }, 50);
    })();
  </script>
  
  <!-- Fallback for users with JavaScript disabled -->
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://api.risingpunk.com/go">
  </noscript>
  
  <!-- Visible content while redirecting (for YouTube validation and slow connections) -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #51cf66, #4dabf7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.2em;
      line-height: 1.6;
      margin-bottom: 30px;
      color: #ccc;
    }
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #51cf66;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .fallback-link {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 40px;
      background: #51cf66;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>RisingPunk</h1>
    <p>Redirecting to download...</p>
    <div class="spinner"></div>
    <noscript>
      <p>If you are not redirected automatically, <a href="https://api.risingpunk.com/go" class="fallback-link">click here</a>.</p>
    </noscript>
  </div>
</body>
</html>
