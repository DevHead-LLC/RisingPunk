# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
#
# We include all ABIs to support existing devices (32-bit + 64-bit). 16 KB page size
# alignment is addressed via android.bundle.enableUncompressedNativeLibs=true and
# packaging.jniLibs.useLegacyPackaging=false; restricting to 64-bit only would pass
# 16 KB but drops ~6k+ devices. See taskItems/android/deployment/16kb-page-size-fix.md
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
# Note: As of React Native 0.82, setting newArchEnabled=false is no longer supported; RN runs with New Arch by default.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Enable Gradle build cache for faster incremental builds
org.gradle.caching=true

# ============================================================================
# 🚨 CRITICAL: 16 KB PAGE SIZE SUPPORT - DO NOT REMOVE OR MODIFY! 🚨
# ============================================================================
# Enable 16 KB page size support for native libraries
# This ensures .so files are stored uncompressed and properly aligned for 16 KB page sizes
# Required for Google Play Console compliance (deadline: May 2026)
# 
# ⚠️  KNOWN ISSUE - React Native 0.76.6 LIMITATION:
# Even with this property set correctly, Google Play Console may STILL reject builds
# with error: "Your app does not support 16 KB memory page sizes"
#
# REASON: React Native 0.76.6 uses pre-built native libraries from Maven Central
# (react-android, hermes-android) that may NOT be 16 KB aligned, even with correct
# build configuration. This is a limitation of React Native 0.76.6.
#
# SOLUTION: Upgrade to React Native 0.77+ which has proper 16 KB support for
# pre-built libraries. Until then, this error may persist despite correct configuration.
#
# This property works in conjunction with:
# - packaging.jniLibs.useLegacyPackaging = false (in app/build.gradle)
# - NDK r27+ (configured in build.gradle)
# - targetSdkVersion = 35 (Android 15)
#
# Build verification will warn if this is not set correctly.
# See: taskItems/android/deployment/16kb-page-size-fix.md
# ============================================================================
android.bundle.enableUncompressedNativeLibs=true