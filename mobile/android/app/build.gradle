apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// CRITICAL: Set ENVFILE before react-native-config loads it
// This ensures dotenv.gradle reads the correct file
def envFile = System.env['ENVFILE'] ?: System.getProperty('ENVFILE') ?: project.findProperty("ENVFILE")
if (envFile) {
    // Make sure ENVFILE is available to react-native-config
    System.setProperty('ENVFILE', envFile)
    project.ext.set('ENVFILE', envFile)
    println "🔧 Setting ENVFILE for react-native-config: ${envFile}"
} else {
    println "⚠️ WARNING: ENVFILE not set before react-native-config load!"
    println "   This may cause react-native-config to use default .env file"
}

// react-native-config configuration
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// Log environment info after react-native-config loads it (configuration phase)
gradle.projectsEvaluated {
    // Reuse envFile from outer scope, or read it again if not set
    def configEnvFile = envFile ?: System.env['ENVFILE'] ?: System.getProperty('ENVFILE') ?: project.findProperty("ENVFILE")
    if (configEnvFile) {
        println ""
        println "=========================================="
        println "🔍 ENVIRONMENT FILE DETECTED (Configuration Phase)"
        println "=========================================="
        println "ENVFILE: ${configEnvFile}"
        
        // Verify the .env file exists and read its contents
        def envFilePath = new File(project.rootDir.parent, configEnvFile)
        if (envFilePath.exists()) {
            def envProps = new Properties()
            envFilePath.withInputStream { envProps.load(it) }
            def apiEnv = envProps.getProperty("API_ENV", "").trim()
            def apiUrl = envProps.getProperty("API_URL", "").trim()
            println "Environment file: ${envFilePath.absolutePath}"
            println "API_ENV: ${apiEnv}"
            println "API_URL: ${apiUrl}"
        } else {
            println "⚠️ WARNING: Environment file not found at ${envFilePath.absolutePath}"
        }
        println "=========================================="
        println ""
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// versionName from mobile/package.json (single source of truth)
def packageJsonFile = rootProject.file("../package.json")
if (!packageJsonFile.exists()) {
    throw new GradleException("package.json not found at ${packageJsonFile.absolutePath}")
}
def packageJsonText = packageJsonFile.text
def versionMatcher = (packageJsonText =~ /"version"\s*:\s*"([^"]+)"/)
if (!versionMatcher.find()) {
    throw new GradleException("Could not find \"version\" in package.json")
}
def versionNameFromPackage = versionMatcher.group(1)
def versionCodeMatcher = (packageJsonText =~ /"versionCode"\s*:\s*(\d+)/)
if (!versionCodeMatcher.find()) {
    throw new GradleException("Could not find \"versionCode\" in package.json")
}
def versionCodeFromPackage = versionCodeMatcher.group(1).toInteger()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.devheadllc.risingpunk"
    defaultConfig {
        applicationId "com.devheadllc.risingpunk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeFromPackage
        versionName versionNameFromPackage
        
        // Support all ABIs so we don't drop devices (32-bit + 64-bit). 16 KB alignment
        // is handled by enableUncompressedNativeLibs + useLegacyPackaging=false; 64-bit-only
        // would satisfy 16 KB but drops ~6k+ devices. See 16kb-page-size-fix.md.
        // ndk { abiFilters ... } omitted = all ABIs included.
        
        // CRITICAL: Verify react-native-config values are being set
        // These should be set by dotenv.gradle, but we verify here
        if (project.hasProperty('env')) {
            println ""
            println "✅ react-native-config env loaded: ${project.env.size()} variables"
            project.env.each { k, v ->
                // Only show first 50 chars of value for security
                def displayValue = v.length() > 50 ? v.substring(0, 50) + "..." : v
                println "  - ${k}: ${displayValue}"
            }
            println ""
            
            // CRITICAL: Verify API_ENV is set correctly
            if (project.env.containsKey('API_ENV')) {
                def apiEnv = project.env['API_ENV']
                println "✅ API_ENV will be set in BuildConfig: ${apiEnv}"
                if (apiEnv != 'prod' && apiEnv != 'staging' && apiEnv != 'dev') {
                    println "⚠️ WARNING: API_ENV has unexpected value: ${apiEnv}"
                }
            } else {
                println "🚨 CRITICAL ERROR: API_ENV not found in env variables!"
                println "   This will cause the app to use wrong environment!"
            }
            
            // Verify API_URL is set (only required for staging/prod, not dev)
            def apiEnv = project.env.containsKey('API_ENV') ? project.env['API_ENV'] : null
            if (project.env.containsKey('API_URL')) {
                def apiUrl = project.env['API_URL']
                println "✅ API_URL will be set in BuildConfig: ${apiUrl}"
            } else {
                // Only warn if this is staging or prod build (dev uses DEV_URL_ANDROID/DEV_URL_IOS)
                if (apiEnv == 'staging' || apiEnv == 'prod') {
                    println "⚠️ WARNING: API_URL not found in env variables! (Required for ${apiEnv} builds)"
                } else {
                    println "ℹ️ INFO: API_URL not set (expected for dev builds - using DEV_URL_ANDROID/DEV_URL_IOS instead)"
                }
            }
            println ""
        } else {
            println ""
            println "🚨 CRITICAL ERROR: react-native-config env not found!"
            println "   BuildConfig will NOT have environment variables!"
            println "   The app will fail to determine correct API URL!"
            println ""
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
        // Skip Kotlin metadata version check to work around Firebase BOM 34.7.0 requiring Kotlin 2.1.0+
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // Enable 16 KB page size support (required for Android 15+ / Google Play)
            // Note: React Native 0.76.6 may need upgrade to 0.77+ for full automatic support
        }
    }
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    
    // CRITICAL: Explicitly configure native library packaging for 16 KB page size support
    // This is the NEW API (AGP 8.6+) - replaces deprecated packagingOptions
    // This works in conjunction with android.bundle.enableUncompressedNativeLibs=true in gradle.properties
    // 
    // NOTE: packagingOptions (deprecated) was removed to avoid duplication.
    // The new 'packaging' block is the correct API for AGP 8.6+ and React Native 0.76.6+
    packaging {
        jniLibs {
            useLegacyPackaging = false  // Required for 16 KB page size support - must be false
        }
    }
}

afterEvaluate {
    tasks.matching { task ->
        def name = task.name.toLowerCase()
        (name.contains("release") && name.contains("bundle")) || 
        (name.contains("assemble") && name.contains("release"))
    }.configureEach { task ->
        task.doFirst {
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException("Release signing requires keystore.properties file at ${keystorePropertiesFile.absolutePath}")
            }
            
            // CRITICAL: Verify environment file is set correctly for ALL release builds (both bundle and assemble)
            // Read ENVFILE the same way react-native-config does
            def taskEnvFile = System.env['ENVFILE'] ?: System.getProperty('ENVFILE') ?: project.findProperty("ENVFILE")
            def isBundleRelease = name.contains("bundle") && name.contains("release")
            def isAssembleRelease = name.contains("assemble") && name.contains("release")
            def isReleaseBuild = isBundleRelease || isAssembleRelease
            
            // Run validation for ALL release builds (both AAB and APK)
            if (isReleaseBuild) {
                println ""
                println "=========================================="
                println "🔍 BUILD ENVIRONMENT VERIFICATION (Execution Phase)"
                println "=========================================="
                println "Task: ${task.name}"
                println "Build Type: ${isBundleRelease ? 'AAB (Bundle)' : 'APK (Assemble)'}"
                println "ENVFILE from System.env: ${System.env['ENVFILE'] ?: 'NOT SET'}"
                println "ENVFILE from System.getProperty: ${System.getProperty('ENVFILE') ?: 'NOT SET'}"
                println "ENVFILE from project property: ${project.findProperty('ENVFILE') ?: 'NOT SET'}"
                println "ENVFILE resolved: ${taskEnvFile ?: 'NOT SET'}"
                
                if (!taskEnvFile) {
                    def taskType = isBundleRelease ? "bundleRelease" : "assembleRelease"
                    throw new GradleException("""
🚨 CRITICAL ERROR: ENVFILE is not set for release build!

For PRODUCTION builds, you MUST use:
  ./gradlew ${taskType} -DENVFILE=.env.prod

For STAGING builds, you MUST use:
  ./gradlew ${taskType} -DENVFILE=.env.staging

Current ENVFILE: ${taskEnvFile ?: 'NOT SET'}
This build will FAIL to prevent incorrect environment deployment.
                    """)
                }
                
                // Verify the .env file exists
                def envFilePath = new File(project.rootDir.parent, taskEnvFile)
                if (!envFilePath.exists()) {
                    throw new GradleException("""
🚨 CRITICAL ERROR: Environment file not found!

Expected file: ${envFilePath.absolutePath}
ENVFILE specified: ${taskEnvFile}

Please verify the .env file exists in the mobile/ directory.
                    """)
                }
                
                // Read and verify API_ENV from the file
                def envProps = new Properties()
                envFilePath.withInputStream { envProps.load(it) }
                def apiEnv = envProps.getProperty("API_ENV", "").trim()
                def apiUrl = envProps.getProperty("API_URL", "").trim()
                
                println "Environment file: ${envFilePath.absolutePath}"
                println "API_ENV from file: ${apiEnv}"
                println "API_URL from file: ${apiUrl}"
                
                // Verify production builds use production environment
                if (taskEnvFile.contains("prod") || taskEnvFile.contains(".env.prod")) {
                    if (apiEnv != "prod") {
                        throw new GradleException("""
🚨 CRITICAL ERROR: Production build using wrong environment!

Expected: API_ENV=prod in .env.prod
Actual: API_ENV=${apiEnv} in ${taskEnvFile}

This will cause the app to connect to the wrong server!
                        """)
                    }
                    if (!apiUrl.contains("risingpunk.com")) {
                        throw new GradleException("""
🚨 CRITICAL ERROR: Production build using wrong API URL!

Expected: API_URL=https://api.risingpunk.com in .env.prod
Actual: API_URL=${apiUrl} in ${taskEnvFile}

This will cause the app to connect to the wrong server!
                        """)
                    }
                    println "✅ PRODUCTION BUILD VERIFIED"
                    println "   - API_ENV: ${apiEnv}"
                    println "   - API_URL: ${apiUrl}"
                } else if (taskEnvFile.contains("staging") || taskEnvFile.contains(".env.staging")) {
                    if (apiEnv != "staging") {
                        throw new GradleException("""
🚨 CRITICAL ERROR: Staging build using wrong environment!

Expected: API_ENV=staging in .env.staging
Actual: API_ENV=${apiEnv} in ${taskEnvFile}
                        """)
                    }
                    println "✅ STAGING BUILD VERIFIED"
                    println "   - API_ENV: ${apiEnv}"
                    println "   - API_URL: ${apiUrl}"
                }
                
                println "Version Code: ${defaultConfig.versionCode}"
                println "Version Name: ${defaultConfig.versionName}"
                
                // CRITICAL: Verify 16 KB page size configuration
                println ""
                println "🔍 16 KB PAGE SIZE CONFIGURATION VERIFICATION"
                println "=========================================="
                // Read from gradle.properties (project properties are automatically loaded)
                def enableUncompressedNativeLibs = project.findProperty('android.bundle.enableUncompressedNativeLibs')
                def reactNativeArchitectures = project.findProperty('reactNativeArchitectures') ?: ''
                
                println "android.bundle.enableUncompressedNativeLibs: ${enableUncompressedNativeLibs ?: 'NOT SET (check gradle.properties)'}"
                println "reactNativeArchitectures: ${reactNativeArchitectures ?: 'NOT SET (check gradle.properties)'}"
                println "packaging.jniLibs.useLegacyPackaging: false (configured in build.gradle - verify manually if build fails)"
                println "NDK Version: ${rootProject.ext.ndkVersion}"
                println "targetSdkVersion: ${rootProject.ext.targetSdkVersion}"
                println "compileSdkVersion: ${rootProject.ext.compileSdkVersion}"
                
                def configOk = true
                def errors = []
                
                if (enableUncompressedNativeLibs != 'true') {
                    errors.add("android.bundle.enableUncompressedNativeLibs is not 'true' in gradle.properties")
                    configOk = false
                }
                // 16 KB: We support all ABIs for device reach. If 32-bit is present, Google may show 16 KB error.
                def archList = reactNativeArchitectures.split(',').collect { it.trim().toLowerCase() }.findAll { it }
                def has32Bit = archList.any { it == 'armeabi-v7a' || it == 'x86' }
                if (has32Bit) {
                    println "⚠️  16 KB: reactNativeArchitectures includes 32-bit (armeabi-v7a/x86). Google Play may show 'Your app does not support 16 KB memory page sizes.'"
                    println "   To pass 16 KB you would restrict to arm64-v8a,x86_64 only—but that drops ~6k+ devices. Long-term: upgrade to RN 0.77+ (see 16kb-page-size-fix.md)."
                }
                // Parse NDK version to check if it's r27+ (required for 16 KB page size support)
                def ndkVersionParts = rootProject.ext.ndkVersion.split("\\.")
                def ndkMajorVersion = ndkVersionParts[0].toInteger()
                if (ndkMajorVersion < 27) {
                    errors.add("NDK version ${rootProject.ext.ndkVersion} is not r27+ (required for 16 KB support). Current major version: ${ndkMajorVersion}")
                    configOk = false
                }
                if (rootProject.ext.targetSdkVersion < 35) {
                    errors.add("targetSdkVersion ${rootProject.ext.targetSdkVersion} is less than 35 (Android 15)")
                    configOk = false
                }
                
                
                if (configOk) {
                    println "✅ 16 KB alignment config verified (enableUncompressedNativeLibs, NDK r27+, targetSdk 35, useLegacyPackaging=false)"
                    println "   All ABIs included for device support; if Google shows 16 KB error, see taskItems/android/deployment/16kb-page-size-fix.md"
                } else {
                    // FAIL THE BUILD - Don't waste time uploading to Google Play Console
                    def errorMessage = """
🚨 BUILD FAILED: 16 KB Page Size Configuration is INCORRECT!

Google Play Console will REJECT this build with error:
"Your app does not support 16 KB memory page sizes"

Configuration Issues Found:
"""
                    errors.each { error ->
                        errorMessage += "   ❌ ${error}\n"
                    }
                    errorMessage += """
==========================================
HOW TO FIX:
==========================================

1. Fix android.bundle.enableUncompressedNativeLibs:
   - Open: mobile/android/gradle.properties
   - Ensure this line exists: android.bundle.enableUncompressedNativeLibs=true
   - If missing, add it (see taskItems/android/deployment/16kb-page-size-fix.md)

2. Fix NDK Version (if needed):
   - Open: mobile/android/build.gradle
   - Ensure: ndkVersion = "27.0.12077973" (or newer r27+ version)
   - Install NDK r27+ via Android Studio SDK Manager if not installed

3. Fix targetSdkVersion (if needed):
   - Open: mobile/android/build.gradle
   - Ensure: targetSdkVersion = 35

4. Verify packaging configuration:
   - Open: mobile/android/app/build.gradle
   - Ensure packaging block has: useLegacyPackaging = false
   - (This should already be configured correctly)

After fixing, rebuild:
  cd mobile
  npm run android:clean
  npm run android:build:bundle

See: taskItems/android/deployment/16kb-page-size-fix.md for complete guide
==========================================
"""
                    throw new GradleException(errorMessage)
                }
                println "=========================================="
                println ""
            }
        }
    }
    
    // Log NDK version being used (for verification)
    tasks.whenTaskAdded { task ->
        if (task.name.contains("Release") && task.name.contains("Native")) {
            task.doFirst {
                println "Using NDK version: ${rootProject.ext.ndkVersion}"
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Edge-to-edge display (Android 15+ / SDK 35) - Google Play Console recommendation
    // enableEdgeToEdge() requires core-ktx 1.17.0+
    implementation("androidx.core:core-ktx:1.17.0")

    // react-native-config (manually linked)
    implementation project(':react-native-config')

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
