			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n\n# Set ENVFILE for react-native-config\n# Priority: 1) ENVFILE from npm script (when running via npm run ios:dev), 2) /tmp/envfile from PreAction, 3) ENVFILE from Xcode scheme, 4) API_ENV build setting, 5) default\n# When running via npm, ENVFILE is already set, so we respect that\nif [ -n \"$ENVFILE\" ]; then\n  # ENVFILE is already set (from npm script or Xcode scheme) - use it as-is\n  ENVFILE_VALUE=\"$ENVFILE\"\n  echo \"[React Native Bundle] Using existing ENVFILE: $ENVFILE_VALUE\"\nelif [ -f /tmp/envfile ]; then\n  # Read from /tmp/envfile (set by PreAction in Xcode scheme)\n  ENVFILE_VALUE=$(cat /tmp/envfile | tr -d '[:space:]')\n  echo \"[React Native Bundle] Using ENVFILE from /tmp/envfile: $ENVFILE_VALUE\"\nelif [ -n \"$API_ENV\" ]; then\n  # Fall back to API_ENV build setting (for Xcode-only builds without scheme ENVFILE)\n  case \"$API_ENV\" in\n    dev)\n      ENVFILE_VALUE=\".env.dev\"\n      ;;\n    staging)\n      ENVFILE_VALUE=\".env.staging\"\n      ;;\n    prod)\n      ENVFILE_VALUE=\".env.prod\"\n      ;;\n    *)\n      echo \"Warning: Unknown API_ENV value: $API_ENV, defaulting to .env\"\n      ENVFILE_VALUE=\".env\"\n      ;;\n  esac\n  echo \"[React Native Bundle] Using ENVFILE from API_ENV build setting: $ENVFILE_VALUE\"\nelse\n  echo \"Warning: Neither ENVFILE nor API_ENV is set, defaulting to .env\"\n  ENVFILE_VALUE=\".env\"\nfi\n\n# Write to /tmp/envfile (react-native-config checks this first)\necho \"$ENVFILE_VALUE\" > /tmp/envfile\n\n# Also export as environment variable (for react-native-config)\nexport ENVFILE=\"$ENVFILE_VALUE\"\n\necho \"[React Native Bundle] Final ENVFILE=$ENVFILE_VALUE\"\n\nWITH_ENVIRONMENT=\"$REACT_NATIVE_PATH/scripts/xcode/with-environment.sh\"\nREACT_NATIVE_XCODE=\"$REACT_NATIVE_PATH/scripts/react-native-xcode.sh\"\n\n/bin/sh -c \"$WITH_ENVIRONMENT $REACT_NATIVE_XCODE\"\n";
		};
